name: build-macos

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            jre_arch: aarch64
          - runner: macos-13
            arch: x64
            jre_arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
          JRE_ARCH: ${{ matrix.jre_arch }}
        run: bash ci/build-macos.sh "$ARCH" "$JRE_ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: cogcraft-macos-${{ matrix.arch }}
          path: dist/cogcraft-macos-*.zip
          retention-days: 30
