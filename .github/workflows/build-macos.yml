name: build-macos

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            jre_arch: aarch64
          - runner: macos-13
            arch: x64
            jre_arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install --upgrade pip pywebview pyinstaller

      - name: Fetch bundled JRE 21
        env:
          JRE_ARCH: ${{ matrix.jre_arch }}
        run: curl -fsSL -o /tmp/jre.tar.gz "https://api.adoptium.net/v3/binary/latest/21/ga/mac/${JRE_ARCH}/jre/hotspot/normal/eclipse"

      - name: Unpack JRE
        run: mkdir -p runtime && tar xzf /tmp/jre.tar.gz -C runtime --strip-components=1 && ./runtime/bin/java -version

      - name: PyInstaller build
        run: pyinstaller --noconfirm --windowed --onedir --name cogcraft --osx-bundle-identifier top.cogcraft.launcher --hidden-import webview.platforms.cocoa --add-data ui:ui --add-data engine:engine --add-data runtime:runtime --add-data manifest.example.json:. app.py

      - name: Zip app
        env:
          ARCH: ${{ matrix.arch }}
        run: cd dist && ditto -c -k --sequesterRsrc --keepParent cogcraft.app "cogcraft-macos-${ARCH}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: cogcraft-macos-${{ matrix.arch }}
          path: dist/cogcraft-macos-${{ matrix.arch }}.zip
          retention-days: 30
