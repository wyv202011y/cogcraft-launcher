name: build

# 所有构建都在 GitHub 的 runner 上做，本地一行命令都不用跑，也不需要暴露任何东西。
# 平台只出两个：Windows x64（玩家主力）+ macOS arm64（Apple Silicon）。
# 不做 x86 macOS —— Intel Mac 现在占比极低，多养一台 runner 不划算。
# 手动触发出 test 包（Artifacts）；打 tag 出正式包并自动建 Release（玩家直接下载）。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: python ci/build.py x64
      - uses: actions/upload-artifact@v4
        with:
          name: cogcraft-windows-x64
          path: dist/cogcraft-*.zip
          retention-days: 30

  # GitHub-hosted macOS runner 平台侧故障（2026-11 起分不到机器，job 1 秒被 cancelled）。
  # 保留等恢复，但 release 绝不能依赖它 —— 否则 Windows 明明成功也会被它卡住发不出去。
  build-macos:
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: python ci/build.py arm64
      - uses: actions/upload-artifact@v4
        with:
          name: cogcraft-macos-arm64
          path: dist/cogcraft-*.zip
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 生成校验和
        run: cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: 建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --title "$GITHUB_REF_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"
