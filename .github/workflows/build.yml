name: build

# 所有构建都在 GitHub 的 runner 上做，本地一行命令都不用跑，也不需要暴露任何东西。
# 手动触发出 test 包（Artifacts）；打 tag 出正式包并自动建 Release（玩家直接下载）。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            label: windows-x64
          - runner: macos-14
            arch: arm64
            label: macos-arm64
          - runner: macos-13
            arch: x64
            label: macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: python ci/build.py ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: cogcraft-${{ matrix.label }}
          path: dist/cogcraft-*.zip
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 生成校验和
        run: cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: 建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --title "$GITHUB_REF_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"
