name: build

# 所有构建都在 GitHub 的 runner 上做，本地一行命令都不用跑，也不需要暴露任何东西。
# 平台只出两个：Windows x64（玩家主力）+ macOS arm64（Apple Silicon）。
# 不做 x86 macOS —— Intel Mac 现在占比极低，多养一台 runner 不划算。
# 手动触发出 test 包（Artifacts）；打 tag 出正式包并自动建 Release（玩家直接下载）。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: python ci/build.py x64
      - uses: actions/upload-artifact@v4
        with:
          name: cogcraft-windows-x64
          path: dist/cogcraft-*.zip
          retention-days: 30

  # ⚠️ 标签别写 macos-14：这台 runner 会 1 秒被杀，报
  #    "The configuration 'macos-14-arm64-us-default' is not supported"。
  #    2026-11-24 实测：macos-14 ❌、macos-15 ✅（macOS 15.8.2）、macos-latest ✅（macOS 26.7.2）。
  #    用 macos-15 而不用 latest —— 打出来的包要能在玩家那些老系统上跑。
  #    macos-13 是 Intel，出不了 arm64 包，别用。
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: python ci/build.py arm64
      - uses: actions/upload-artifact@v4
        with:
          name: cogcraft-macos-arm64
          path: dist/cogcraft-*.zip
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    # 两个平台都齐了才发：宁可整条流水线红一次，也不要发出缺 mac 包的版本
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 生成校验和
        run: cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: 建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --title "$GITHUB_REF_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"
