<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cogcraft</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased;
    user-select:none; }
:root{
  --bg:#0f1115; --bg2:#131619; --line:#1b1f26; --line2:#232a33;
  --fg:#f2f5f9; --fg2:#dfe4ec; --muted:#5c6472; --muted2:#8b94a1;
  --accent:#4f7cff; --accent2:#6fa0ff;
  --ok:#5fb87c; --warn:#d1a054; --err:#e06c6c;
}
html,body{ height:100%; }
body{
  background:var(--bg); color:var(--fg); overflow:hidden;
  font-family:"Inter","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:13px;
}
#app{ height:100vh; display:flex; flex-direction:column; position:relative; }

/* ── 顶栏 ── */
.topbar{ height:44px; flex:none; display:flex; align-items:center; gap:10px;
  padding:0 16px; border-bottom:1px solid var(--line); color:var(--muted);
  font-size:12.5px; letter-spacing:.3px; }
.brand{ color:var(--fg2); font-weight:600; letter-spacing:.8px; }
.sep{ color:#2f363f; }
.chip{ display:flex; align-items:center; gap:6px; font-size:11.5px; }
/* 启动器有新版本：顶栏一颗小胶囊，不抢注意力但看得见 */
.chip.up{ padding:4px 10px; border-radius:999px; cursor:pointer; font-weight:600;
  color:#e7bd63; background:#2a2313; border:1px solid #3d3116; }
.chip.up.must{ color:#ff9c8c; background:#2a1613; border-color:#40201a; }
/* 更新包已下好，等玩家点一下重启完成更新：绿色=可以动了，不按也能继续用 */
.chip.up.ready{ color:#9be7a8; background:#12281a; border-color:#1e4030; }
.chip.up.busy{ cursor:default; opacity:.85; }
.chip.up:hover{ filter:brightness(1.18); }
.dot{ width:7px; height:7px; border-radius:50%; background:var(--muted); }
.dot.ok{ background:var(--ok); box-shadow:0 0 8px #5fb87c88; }
.dot.warn{ background:var(--warn); }
.spacer{ flex:1; }
.iconbtn{ width:30px; height:30px; border-radius:8px; border:none; background:transparent;
  color:var(--muted2); cursor:pointer; display:flex; align-items:center; justify-content:center; }
.iconbtn:hover{ background:#181c22; color:var(--fg2); }
.winbtns{ display:flex; gap:9px; margin-left:6px; }
.winbtns i{ width:11px; height:11px; border-radius:50%; background:#2a3038; display:block; }

/* ── 主区 ── */
.main{ flex:1; display:flex; flex-direction:column; align-items:center;
  justify-content:center; position:relative; }
.grid{ position:absolute; inset:0;
  background-image:linear-gradient(#151920 1px,transparent 1px),
                   linear-gradient(90deg,#151920 1px,transparent 1px);
  background-size:40px 40px;
  -webkit-mask-image:radial-gradient(circle at 50% 46%,#000 0%,transparent 72%);
  mask-image:radial-gradient(circle at 50% 46%,#000 0%,transparent 72%); }

.mark{ width:84px; height:84px; border-radius:21px; position:relative; z-index:2;
  background:linear-gradient(145deg,#1d2430,#12161d); border:1px solid #232a34;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 20px 50px -20px #000, inset 0 1px 0 #2c3542; }
.mark span{ font-size:32px; font-weight:700; color:#e9edf3; letter-spacing:-1px; }

h1{ position:relative; z-index:2; margin-top:24px; font-size:26px; font-weight:650;
  letter-spacing:.5px; }
h1 em{ font-style:normal; color:var(--muted); font-weight:400; }
.srv{ position:relative; z-index:2; margin-top:8px; font-size:12.5px; color:var(--muted);
  letter-spacing:.4px; display:flex; align-items:center; gap:7px; }

/* ── 进度 ── */
.prog{ position:relative; z-index:2; width:384px; margin-top:34px; }
.bar{ height:3px; background:#1a1f27; border-radius:3px; overflow:hidden; }
.bar i{ display:block; height:100%; width:0%; border-radius:3px;
  background:linear-gradient(90deg,#4f7cff,#6fa0ff); transition:width .25s ease; }
.bar.indet i{ width:35%; animation:slide 1.1s ease-in-out infinite; }
@keyframes slide{ 0%{margin-left:-35%} 100%{margin-left:100%} }
.ptxt{ display:flex; justify-content:space-between; margin-top:10px; font-size:12.5px;
  color:#6e7987; min-height:17px; }
.ptxt b{ color:var(--muted2); font-weight:500; }

/* ── 按钮 ── */
.btn{ position:relative; z-index:2; margin-top:30px; width:276px; height:50px;
  border-radius:12px; background:#e9edf3; color:#0b0d10; font-size:15px;
  font-weight:640; letter-spacing:1.4px; border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:9px;
  transition:transform .12s ease, background .15s ease; }
.btn:hover:not(:disabled){ background:#fff; transform:translateY(-1px); }
.btn:active:not(:disabled){ transform:translateY(0); }
.btn:disabled{ background:#1e242c; color:#5a6470; cursor:default; }
.btn.sub{ background:transparent; border:1px solid var(--line2); color:var(--muted2);
  width:150px; height:44px; font-size:13px; font-weight:500; letter-spacing:.5px; }
.btn.sub:hover:not(:disabled){ background:#181c22; color:var(--fg2); }

/* ── 底栏 ── */
.foot{ position:relative; z-index:2; display:flex; gap:22px; margin-top:24px;
  font-size:11.5px; color:#404855; }
.foot b{ color:#6b7382; font-weight:500; }
.pill{ position:absolute; right:18px; bottom:16px; z-index:3; font-size:11px;
  padding:5px 11px; border-radius:20px; color:var(--muted); border:1px solid var(--line); }
.pill.ok{ color:var(--ok); border-color:#1e3326; background:#101a14; }
.pill.err{ color:var(--err); border-color:#3a1f22; background:#1a1013; }

/* ── 设置面板 ── */
.panel{ position:absolute; inset:44px 0 0 0; background:#0c0e12; z-index:10;
  display:flex; flex-direction:column; transform:translateY(12px);
  opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease; }
.panel.on{ opacity:1; transform:none; pointer-events:auto; }
.phead{ padding:20px 28px 0; display:flex; align-items:baseline; gap:12px; }
.phead h2{ font-size:17px; font-weight:640; }
.phead p{ font-size:11.5px; color:var(--muted); }
.pbody{ flex:1; overflow-y:auto; padding:16px 28px 8px; display:flex; gap:16px; }
.pbody::-webkit-scrollbar{ width:8px; }
.pbody::-webkit-scrollbar-thumb{ background:#232a33; border-radius:8px; }
.col{ flex:1; display:flex; flex-direction:column; gap:12px; }
.card{ background:var(--bg2); border:1px solid var(--line); border-radius:12px;
  padding:15px 17px; }
.card .lab{ font-size:11.5px; color:var(--muted); display:flex; align-items:center; }
.big{ font-size:27px; font-weight:650; letter-spacing:-.5px; margin-top:2px; }
.big span{ font-size:12px; color:var(--muted); font-weight:400; margin-left:4px; }

input[type=range]{ -webkit-appearance:none; width:100%; height:22px; margin-top:12px;
  background:transparent; cursor:pointer; }
input[type=range]::-webkit-slider-runnable-track{ height:5px; border-radius:5px;
  background:linear-gradient(90deg,var(--accent) 0%,var(--accent) var(--fill,58%),
             #1a1f27 var(--fill,58%),#1a1f27 100%); }
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:16px; height:16px;
  border-radius:50%; background:#fff; margin-top:-5.5px; box-shadow:0 2px 8px #0008; }
.ticks{ display:flex; justify-content:space-between; font-size:10.5px; color:#454d59;
  margin-top:4px; }
.hint{ font-size:11.5px; color:var(--muted); line-height:1.65; margin-top:10px; }
.hint b{ color:var(--muted2); font-weight:500; }
.hint .warn{ color:var(--warn); }
.hint .err{ color:var(--err); }

.row{ display:flex; align-items:center; padding:10px 0; border-bottom:1px solid #191d23;
  font-size:12.5px; }
.row:last-child{ border-bottom:none; padding-bottom:0; }
.row:first-child{ padding-top:0; }
.row .nm{ color:var(--fg2); }
.row .ds{ font-size:11px; color:#525a66; margin-top:3px; }
.row .right{ margin-left:auto; }
.seg{ display:flex; background:#0d1014; border:1px solid #1e242c; border-radius:8px;
  overflow:hidden; }
.seg button{ padding:6px 13px; font-size:11.5px; color:var(--muted); background:transparent;
  border:none; cursor:pointer; font-family:inherit; }
.seg button.on{ background:#24304a; color:#cfe0ff; }
.args{ background:#0b0e11; border:1px solid #181d23; border-radius:9px; padding:10px 12px;
  font-family:"JetBrains Mono",Consolas,monospace; font-size:10px; color:#5e6a79;
  line-height:1.7; max-height:96px; overflow-y:auto; word-break:break-all; }
input[type=text]{ width:100%; background:#0d1014; border:1px solid #1e242c; color:var(--fg2);
  border-radius:8px; padding:8px 11px; font-size:12.5px; font-family:inherit; outline:none; }
input[type=text]:focus{ border-color:#2f4a7a; }
.pfoot{ flex:none; padding:12px 28px 18px; display:flex; align-items:center; gap:10px;
  border-top:1px solid var(--line); }
.mono{ font-family:"JetBrains Mono",Consolas,monospace; }
.hidden{ display:none !important; }

/* ── 下载详情：步骤清单 ── */
.hero{ display:flex; flex-direction:column; align-items:center; }
.steps{ position:relative; z-index:2; width:470px; display:none; flex-direction:column;
  gap:2px; }
#app.busy .steps{ display:flex; }
#app.busy .hero{ display:none; }
#app.busy .btn{ margin-top:26px; }
.stp{ display:flex; align-items:center; gap:11px; height:40px; padding:0 13px;
  border-radius:9px; font-size:12.5px; }
.stp .ic{ width:15px; height:15px; flex:none; border-radius:50%; border:1.5px solid #2a313b;
  display:flex; align-items:center; justify-content:center; font-size:9.5px;
  color:transparent; font-style:normal; }
.stp .nm{ color:#525b69; }
.stp .ms{ margin-left:auto; font-size:12.5px; color:#7b8794; font-weight:500;
  font-variant-numeric:tabular-nums;
  max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.stp.doing{ background:#12161c; }
.stp.doing .nm{ color:var(--fg2); }
.stp.doing .ic{ border-color:var(--accent); border-right-color:transparent;
  border-bottom-color:transparent; animation:spin .75s linear infinite; }
.stp.doing .ms{ color:var(--muted2); }
.stp.done .ic{ background:#16281e; border-color:#2c5b3d; color:#7fd39b; }
.stp.done .ic::after{ content:"✓"; }
.stp.done .nm{ color:#7d8695; }
.stp.fail .ic{ background:#2b1a1c; border-color:#5b2c30; color:#e08a8a; }
.stp.fail .ic::after{ content:"×"; }
.stp.fail .nm{ color:#c98b8b; }
/* 失败时把完整原因摊开显示：以前只写一句「失败」，用户看不到到底是哪个文件、哪个源挂了 */
.ptxt.detail{ white-space:pre-wrap; text-align:left; max-height:150px; overflow:auto;
  font-size:12.5px; line-height:1.55; color:#8a94a2;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* 引导里的昵称输入 + 群卡片：只服务于这两步，不复用设置页的卡片，避免两套样式打架 */
.wname{ width:100%; max-width:560px; margin:0 auto; position:relative; }
.wname input{ width:100%; background:var(--bg2); border:1px solid var(--line); border-radius:10px;
  color:var(--fg); font-size:15px; padding:13px 58px 13px 15px; outline:none;
  transition:border-color .15s; font-family:inherit; }
.wname input:focus{ border-color:#33528c; }
.wname input::placeholder{ color:#3f4855; }
.wname .cnt{ position:absolute; right:14px; top:15px; font-size:11px; color:#4a5260; }
.wname-err{ max-width:560px; margin:8px auto 0; font-size:11.5px; color:#d0616f;
  min-height:16px; opacity:0; transition:opacity .15s; }
.wname-err.on{ opacity:1; }
.qqbox{ width:100%; max-width:560px; margin:0 auto; background:var(--bg2);
  border:1px solid var(--line); border-radius:12px; padding:18px 20px; }
.qqtop{ display:flex; align-items:center; gap:12px; }
.qqtop .qqq{ width:34px; height:34px; border-radius:9px; background:#1b2436;
  color:#6fa8ff; font-size:12px; font-weight:700; display:flex; align-items:center;
  justify-content:center; border:1px solid #23324c; }
.qqtop .qqn{ font-size:14px; font-weight:600; }
.qqtop .qqd{ font-size:11.5px; color:var(--muted); margin-top:3px; }
.qqnum{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:26px;
  letter-spacing:2px; font-weight:600; margin:16px 0 4px; color:#e8eef7; }
.qqbtn{ display:flex; gap:10px; margin-top:14px; }
.qqhint{ font-size:11px; color:#7fd39b; margin-top:10px; min-height:15px; opacity:0;
  transition:opacity .15s; }
.qqhint.on{ opacity:1; }

/* ── 首次引导 ── */
.wizard{ position:absolute; inset:0; z-index:20; background:#0b0d11;
  display:none; flex-direction:column; }
.wizard.on{ display:flex; }
.wtop{ height:52px; flex:none; display:flex; align-items:center; gap:10px;
  padding:0 26px; border-bottom:1px solid var(--line); }
.wtop .cur{ color:#4e5666; font-size:12.5px; }
.wdots{ display:flex; gap:6px; margin-left:auto; }
.wdots i{ width:24px; height:3px; border-radius:3px; background:#1e242c; display:block; }
.wdots i.on{ background:var(--accent); }
.wdots i.done{ background:#2f4a7a; }
.wbody{ flex:1; display:flex; flex-direction:column; justify-content:center;
  align-items:center; padding:0 46px; text-align:center; overflow-y:auto; }
.wbody.lft{ align-items:stretch; text-align:left; justify-content:flex-start;
  padding-top:34px; }
.wtitle{ font-size:25px; font-weight:650; letter-spacing:.4px; }
.wsub{ font-size:12.5px; color:var(--muted); margin-top:12px; line-height:1.9;
  max-width:520px; }
.wsub b{ color:var(--muted2); font-weight:500; }
.wsec{ font-size:11px; color:#414a57; letter-spacing:1.2px; margin:0 0 10px;
  text-transform:uppercase; }
.hwbox{ background:var(--bg2); border:1px solid var(--line); border-radius:12px;
  padding:13px 18px; }
.hwrow{ display:flex; font-size:12.5px; padding:6px 0; align-items:baseline; }
.hwrow .k{ color:var(--muted); width:74px; flex:none; }
.hwrow .v{ color:var(--fg2); }
.wbody .hwbox, .wbody .vcards, .wbody .wsum{ max-width:560px; width:100%; margin:0 auto; }
.wbody .vcards{ margin-top:0; }
.vcards{ display:flex; gap:14px; justify-content:center; }
.vcard{ width:252px; background:var(--bg2); border:1px solid var(--line);
  border-radius:14px; padding:17px 18px; text-align:left; cursor:pointer;
  transition:border-color .15s, transform .12s, background .15s; }
.vcard:hover{ border-color:#2c3648; transform:translateY(-2px); }
.vcard.on{ border-color:#33528c; background:#111725; }
.vcard .vt{ font-size:15px; font-weight:640; display:flex; align-items:center; gap:8px; }
.vcard .vt em{ font-style:normal; font-size:10px; color:#7fd39b; border:1px solid #23422d;
  background:#0f1a14; border-radius:20px; padding:2px 7px; font-weight:400; }
.vcard .vd{ font-size:11.5px; color:var(--muted); margin-top:9px; line-height:1.7; }
.vcard .vm{ font-size:11px; color:#464f5c; margin-top:11px; }
.wsum{ background:var(--bg2); border:1px solid var(--line); border-radius:12px;
  padding:6px 18px; }
.wsum .rw{ display:flex; padding:11px 0; border-bottom:1px solid #191d23;
  font-size:12.5px; }
.wsum .rw:last-child{ border-bottom:none; }
.wsum .rw .k{ color:var(--muted); width:96px; flex:none; }
.wsum .rw .v{ color:var(--fg2); }
.wsum .rw .v em{ font-style:normal; color:var(--muted); }
.brow{ display:flex; align-items:center; gap:16px; background:var(--bg2);
  border:1px solid var(--line); border-radius:12px; padding:13px 18px; margin-top:8px; }
.brow .bsc{ display:flex; align-items:baseline; gap:3px; flex:none; }
.brow .bsc b{ font-size:23px; font-weight:660; color:#8fb0ff; letter-spacing:-.5px; }
.brow .bsc i{ font-style:normal; font-size:11px; color:#4a5260; }
.brow .bsc.wait b{ font-size:13px; color:var(--muted); font-weight:400; }
.brow .bm{ display:flex; flex-wrap:wrap; gap:6px 14px; font-size:11.5px;
  color:var(--muted); margin-left:auto; justify-content:flex-end; }
.brow .bm span{ white-space:nowrap; }
.brow .bm span b{ color:var(--fg2); font-weight:500; }
.bspin{ width:13px; height:13px; border-radius:50%; border:1.5px solid var(--accent);
  border-right-color:transparent; border-bottom-color:transparent;
  animation:spin .75s linear infinite; flex:none; margin-right:8px; }
.wfoot{ flex:none; padding:16px 28px 20px; display:flex; align-items:center;
  gap:10px; border-top:1px solid var(--line); }
.wfoot .btn{ margin-top:0; width:180px; height:46px; font-size:14px; }
.wfoot .btn.sub{ width:104px; height:46px; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <span class="brand">cogcraft</span>
    <span class="sep">/</span>
    <span id="tbState">正在连接服务器</span>
    <div class="spacer"></div>
    <div class="chip" id="connChip"><span class="dot"></span><span id="connText">检查中</span></div>
    <button class="chip up" id="upChip" hidden></button>
    <button class="iconbtn" id="btnSettings" title="设置">⚙</button>
    <div class="winbtns"><i></i><i></i><i></i></div>
  </div>

  <div class="main">
    <div class="grid"></div>
    <div class="hero">
      <div class="mark"><span>cc</span></div>
      <h1>cogcraft <em>客户端</em></h1>
      <div class="srv"><span id="srvName">像素工坊</span><span class="sep">·</span>
        <span id="srvAddr">cogcraft.top:25565</span></div>
    </div>

    <div class="steps" id="steps"></div>

    <div class="prog">
      <div class="bar" id="bar"><i id="barFill"></i></div>
      <div class="ptxt"><span id="pText">正在检查客户端文件</span><span id="pPct"></span></div>
    </div>

    <button class="btn" id="btnMain" disabled>请稍候</button>

    <div class="foot">
      <span>Minecraft <b id="fMc">1.21.1</b></span>
      <span>NeoForge <b id="fNf">21.1.264</b></span>
      <span>模组 <b id="fMods">—</b></span>
      <span>内存 <b id="fRam">—</b></span>
    </div>
    <div class="pill" id="pill">正在初始化</div>
  </div>

  <!-- 首次引导 -->
  <div class="wizard" id="wizard">
    <div class="wtop">
      <span class="brand">cogcraft</span>
      <span class="sep">/</span>
      <span class="cur" id="wStepName">欢迎</span>
      <div class="wdots" id="wDots"><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="wbody" id="wBody"></div>
    <div class="wfoot">
      <button class="btn sub" id="wBack">上一步</button>
      <div class="spacer"></div>
      <button class="btn" id="wNext">开始配置</button>
    </div>
  </div>

  <!-- 设置面板 -->
  <div class="panel" id="panel">
    <div class="phead"><h2>设置</h2><p id="pHw"></p></div>
    <div class="pbody">
      <div class="col">
        <div class="card">
          <div class="lab">分配给游戏的内存</div>
          <div class="big"><span id="memBig">—</span><span>MB</span></div>
          <input type="range" id="memRange" min="1024" max="16384" step="512">
          <div class="ticks"><span id="tMin">1024</span><span id="tMax">16384</span></div>
          <div class="hint" id="memHint"></div>
        </div>
        <div class="card">
          <div class="lab" style="margin-bottom:10px">客户端版本</div>
          <div id="variantRows"></div>
        </div>
      </div>
      <div class="col">
        <div class="card">
          <div class="lab">玩家</div>
          <input type="text" id="playerName" maxlength="16" placeholder="游戏内名字">
          <div class="row" style="padding-top:12px">
            <div><div class="nm">自动进入服务器</div>
              <div class="ds">跳过主菜单直接连服</div></div>
            <div class="right"><div class="seg" id="autoJoinSeg">
              <button data-v="1">开启</button><button data-v="0">关闭</button></div></div>
          </div>
          <div class="row" style="padding-top:12px">
            <div><div class="nm">服务器地址</div>
              <div class="ds" id="srvHint">留空 = 自动</div></div>
            <div class="right"><input type="text" id="srvAddr" placeholder="自动"
              style="width:158px;text-align:right;font-size:12px"></div>
          </div>
        </div>
        <div class="card">
          <div class="lab" style="margin-bottom:8px">Java 运行时</div>
          <div class="hint" id="javaHint" style="margin-top:0">—</div>
        </div>
        <div class="card">
          <div class="lab">JVM 参数<span style="margin-left:auto;font-size:10.5px;color:#3f4855">自动生成</span></div>
          <div class="args mono" id="jvmArgs" style="margin-top:8px">—</div>
        </div>
      </div>
    </div>
    <div class="pfoot">
      <button class="btn sub" id="btnReset">恢复推荐</button>
      <button class="btn sub" id="btnOnboard" style="width:96px">重新引导</button>
      <div class="spacer"></div>
      <button class="btn sub" id="btnClosePanel" style="width:110px">关闭</button>
    </div>
  </div>
</div>

<script>
'use strict';

// ═══ 与 Python 的桥 ═══
// 绝不能在解析时把 api 固定死：pywebview 的桥是页面加载完之后才注入的
// （官方要求监听 pywebviewready）。macOS 的 WKWebView 注入更晚，写死就会
// 永远落到 mockApi()，表现为「进不了引导页 + 点开始准备后永久停在准备中 +
// 界面数据全是假的」。这里改成惰性代理 + 显式等待。
let REAL_API = null;
const MOCK_API = (location.search.indexOf('mock=1') >= 0) ? mockApi() : null;

// ⚠️ pywebview 是**分两步**注入的（看 webview/util.py 的 inject_pywebview）：
//   第一步 run_js(api.js) 建出 window.pywebview = { api: {} } —— 方法还是空的；
//   第二步 run_js(finish.js) 调 _createApi() 挂上全部方法，随后才派发 pywebviewready。
// 所以「window.pywebview 存在」≠「方法可用」。必须等到**具体那个方法**是函数为止，
// 否则 macOS 上会在两步之间抢跑，报「后端桥接未就绪：bootstrap」。
function refreshApi(){
  if (window.pywebview && window.pywebview.api){ REAL_API = window.pywebview.api; return REAL_API; }
  return null;
}
function hasMethod(name){
  const a = refreshApi();
  return !!(a && typeof a[name] === 'function');
}
async function waitMethod(name, ms){
  // ⚠️ 不能写 `ms || 20000`：传 0（浏览器预览模式下「别等，直接用 mock」）会被
  // 当成假值回落成 20 秒，于是每个 API 调用都白卡 20 秒，页面永远停在「正在初始化」。
  const budget = (typeof ms === 'number' && ms >= 0) ? ms : 20000;
  const t0 = Date.now();
  while (true){
    if (hasMethod(name)) return true;
    if (Date.now() - t0 > budget) return false;
    await new Promise(r => setTimeout(r, 100));
  }
}
const api = new Proxy({}, {
  get(_t, name){
    return async function(...args){
      if (!hasMethod(name)){
        // 桥还没挂上这个方法（或是在浏览器里直接打开页面）
        const ok = await waitMethod(name, MOCK_API ? 0 : 20000);
        if (!ok){
          if (MOCK_API && typeof MOCK_API[name] === 'function') return MOCK_API[name](...args);
          throw new Error('启动器后端没就绪（' + String(name) + ' 不可用），请重启应用');
        }
      }
      return REAL_API[name](...args);
    };
  }
});

let S = null;          // 后端 state
let busy = false;
let ready = false;

const $ = (id) => document.getElementById(id);

// ── 事件接收（由 app.py 调 window.__onEvent）──
function handleEvent(kind, data){
  if (kind === 'progress') {
    setProgress(data.pct, data.text, data.label);
    if (data.step === 'done') {
      // 全部收尾：把步骤全打勾，等一下再退回就绪界面
      [].forEach.call($('steps').children, el => {
        el.classList.remove('doing', 'fail');
        el.classList.add('done');
        el.querySelector('.ms').textContent = '';
      });
      setTimeout(() => document.getElementById('app').classList.remove('busy'), 900);
    } else {
      updateSteps(data.step, data.pct, data.text);
    }
  } else if (kind === 'error') {
    failSteps();
    busy = false; ready = false;
    setBar('error');
    const full = data.text || '出错了';
    $('pText').textContent = full;
    $('pText').classList.toggle('detail', full.length > 40 || full.includes('\n'));
    $('pPct').textContent = '';
    $('btnMain').disabled = false;
    $('btnMain').textContent = '重试';
    $('pill').className = 'pill err';
    $('pill').textContent = '❌ 失败';
    $('tbState').textContent = '出错了';
    console.error(data.detail || '');
  } else if (kind === 'bench') {
    applyBench(data);
  } else if (kind === 'phase') {
    const p = data.phase;
    if (p === 'launching' || p === 'running') {
      document.getElementById('app').classList.remove('busy');
    }
    if (p === 'launching') {
      setBar('indet');
      $('pText').textContent = '正在启动游戏…';
      $('pPct').textContent = '';
      $('btnMain').disabled = true;
      $('btnMain').textContent = '启动中';
      $('pill').className = 'pill';
      $('pill').textContent = '🎮 启动中';
    } else if (p === 'running') {
      busy = true;
      setBar('done');
      $('pText').textContent = '游戏运行中';
      $('pPct').textContent = '';
      $('btnMain').disabled = false;
      $('btnMain').textContent = '游戏运行中';
      $('pill').className = 'pill ok';
      $('pill').textContent = '● 游戏中';
      $('tbState').textContent = '游戏运行中';
    } else if (p === 'exited') {
      busy = false;
      $('btnMain').disabled = false;
      $('btnMain').textContent = '进入游戏';
      $('pill').className = 'pill';
      $('pill').textContent = data.text || '已退出';
      $('tbState').textContent = '就绪';
      if (data.oom === 'heap' && data.suggest_mb) {
        $('pText').innerHTML = '内存不足导致崩溃，建议把内存调到 <b>' +
          data.suggest_mb + ' MB</b> 后重试';
        setBar('error');
        toast('已自动记录崩溃原因');
      } else if (data.oom === 'system') {
        $('pText').textContent = data.text;
        setBar('error');
      } else {
        setBar('done');
        $('pText').textContent = data.text;
      }
    }
  }
}

// 依旧挂上推送通道：能推就推（Windows 上通常可用），推不到也无所谓，轮询在跑
window.__onEvent = handleEvent;

// ── 轮询兜底 ──
// macOS 的 WKWebView 下，Python 后台线程调 window.evaluate_js 会被静默吞掉，
// 界面因此永远收不到进度、卡死在「准备中」。改成主动拉：300ms 一次，按 seq 去重。
let pollTimer = null, pollSeq = 0, pollTicks = 0;
function startPolling(){
  stopPolling();
  pollSeq = 0; pollTicks = 0;
  pollTimer = setInterval(async () => {
    pollTicks++;
    if (pollTicks > 24000) { stopPolling(); return; }   // 约 2 小时兜底，别无限轮询
    let p = null;
    try { p = await api.poll(); } catch (e) { return; }
    if (!p) return;
    if (p.seq > pollSeq) { pollSeq = p.seq; handleEvent(p.kind, p.data || {}); }
    const k = p.kind, d = p.data || {};
    const finished = (k === 'error') ||
                     (k === 'phase' && (d.phase === 'running' || d.phase === 'exited'));
    if (finished) stopPolling();
  }, 300);
}
function stopPolling(){ if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

function toast(t){
  $('pill').className = 'pill';
  $('pill').textContent = t;
}

// ── 启动器自更新：在启动器里下完、换好、自己重启 ──
// 以前点了只是把浏览器拉起来跳官网，玩家还得自己下包解压覆盖 —— 那一步现在没了。
let suState = { phase:'idle', pct:0, ready:false, version:'', text:'', error:null };
let lastUpdate = null;
let suFastTimer = null;

async function refreshSelfUpdate(){
  try { const s = await api.get_update_progress(); if (s) suState = s; } catch (e) {}
  if (lastUpdate) renderUpdate(lastUpdate);
}

// 下载时进度要跟得上，20 秒一次太钝；只在下载/解包期间加速，完了自动停
function suFastLoop(){
  if (suFastTimer) return;
  suFastTimer = setInterval(async () => {
    await refreshSelfUpdate();
    const ph = (suState || {}).phase;
    if (ph !== 'downloading' && ph !== 'unpacking'){
      clearInterval(suFastTimer); suFastTimer = null;
    }
  }, 600);
}

async function doPrepareUpdate(){
  try {
    const r = await api.prepare_update();
    if (r && r.ok){ toast('正在下载更新…'); suFastLoop(); return; }
    // 这台机器没法自更新（还在 dmg 里、目录不可写…）：说清原因并给手动下载
    toast((r && r.error) || '这台机器无法自动更新');
    if (r && r.fallback){ try { await api.open_download_page(); } catch (e) {} }
  } catch (e) { toast('准备更新失败：' + e); }
}

async function doApplyUpdate(){
  try {
    const r = await api.apply_update();
    if (r && r.ok){ toast('正在重启完成更新…'); return; }
    toast((r && r.error) || '无法完成更新，请稍后重试或到官网手动下载');
  } catch (e) { toast('更新失败：' + e); }
}

function retrySelfUpdate(){
  suState = { phase:'idle', pct:0, ready:false, version:'', text:'', error:null };
  doPrepareUpdate();
}

// ── 更新提示胶囊：启动器本体 + 服务器下发的游戏文件，两种都走这一处 ──
function renderUpdate(u){
  const chip = $('upChip');
  if (!chip) return;
  const L = (u && u.launcher) || {};
  const F = (u && u.files) || {};
  const filesPending = (Number(F.changed) || 0) + (Number(F.removed) || 0);

  // ① 启动器本体有新版本：点一下就在启动器内下载、替换自己、自动重启，
  //    不再把人踢去浏览器手动下包（那一步正是玩家最烦的）。
  chip.classList.remove('ready', 'busy');
  if (L.available){
    const su = suState || {};
    const sameVer = su.version && L.latest && su.version === L.latest;

    // 正在重启换包：别再让人点
    if (su.phase === 'applying'){
      chip.hidden = false;
      chip.classList.add('busy');
      chip.textContent = '⟳ 正在重启…';
      chip.title = '启动器正在退出并替换文件，完成后会自动打开';
      chip.onclick = null;
      return;
    }

    // 包已就绪：绿胶囊，点一下重启完成更新
    if (su.ready && sameVer){
      chip.hidden = false;
      chip.classList.add('ready');
      chip.textContent = '⟳ 重启完成更新';
      chip.title = '新版本 ' + (su.version || '') + ' 已下载并校验通过，点一下重启完成更新。'
                 + '你的设置、存档路径、证书都会保留。';
      chip.onclick = doApplyUpdate;
      return;
    }

    // 下载/解包中：把进度画在胶囊上
    if (su.phase === 'downloading' || su.phase === 'unpacking'){
      chip.hidden = false;
      chip.classList.add('busy');
      const pct = Math.max(0, Math.min(100, Math.round((Number(su.pct) || 0) * 100)));
      chip.textContent = (su.phase === 'unpacking' ? '⟳ 解包 ' : '↓ ') + pct + '%';
      chip.title = su.text || '正在准备更新';
      chip.onclick = null;
      return;
    }

    // 失败过：明说失败，并给手动下载的退路
    if (su.phase === 'failed'){
      chip.hidden = false;
      chip.classList.toggle('must', !!L.mandatory);
      chip.textContent = '↑ 自动更新失败，点此手动下载';
      chip.title = (su.error || '') + '（也可以稍后再点一次重试）';
      chip.onclick = () => { retrySelfUpdate(); };
      return;
    }

    // 默认：点一下开始下载
    const mb = Math.round((Number((L.pkg || {}).size) || 0) / 1048576);
    chip.hidden = false;
    chip.classList.toggle('must', !!L.mandatory);
    chip.textContent = (L.mandatory ? '↑ 必须更新到 ' : '↑ 有新版本 ') + (L.latest || '');
    chip.title = '点一下在启动器内直接更新'
               + (mb ? ('（约 ' + mb + 'MB）') : '')
               + '：下载 → 校验 → 重启完成，不用去官网手动下包';
    chip.onclick = doPrepareUpdate;
    return;
  }

  // ② 服务器刚下发了新的模组/配置：下次启动游戏时 pipeline 会自动同步，
  //    运行中被映射的 jar 换不掉，所以这里只提示，不假装能热更
  if (filesPending > 0){
    chip.hidden = false;
    chip.classList.remove('must');
    chip.textContent = '↻ ' + filesPending + ' 个文件待更新';
    chip.title = '服务器下发了新内容（' + (F.manifest_updated || '刚刚') + '），'
               + '下次启动游戏时会自动下载';
    chip.onclick = () => toast('新内容会在下次点「启动游戏」时自动同步，无需手动操作');
    return;
  }

  chip.hidden = true;
}

// 启动时查一次 + 之后常驻刷新。
// 后端每 5 分钟带 If-None-Match 重查一次清单（没变就只有 304，几乎零流量）；
// 这里只读后端内存里的结果，完全不发网络 —— 所以可以放得很密而不影响任何人。
async function checkUpdatesOnBoot(){
  try { await api.check_updates_async(); } catch (e) {}
  for (let i = 0; i < 20; i++){
    await new Promise(r => setTimeout(r, 1000));
    let finished = false;
    try {
      const u = await api.get_update();
      if (u && u.update){ lastUpdate = u.update; renderUpdate(u.update); finished = !u.checking; }
    } catch (e) { break; }
    if (finished) break;
  }
  setInterval(async () => {
    try { const u = await api.get_update(); if (u && u.update) lastUpdate = u.update; }
    catch (e) {}
    await refreshSelfUpdate();        // 内部会把 lastUpdate 重新画一遍（含自更新进度）
  }, 20000);
}

function setProgress(pct, text, label){
  const pt = $('pText'); if (pt) pt.classList.remove('detail');
  busy = true;
  if (label) $('tbState').textContent = label;
  if (text) $('pText').textContent = text;
  if (typeof pct === 'number' && pct > 0) {
    setBar('fill');
    $('barFill').style.width = (pct * 100).toFixed(1) + '%';
    $('pPct').textContent = Math.round(pct * 100) + '%';
  } else {
    setBar('indet');
  }
  $('btnMain').disabled = true;
}

function setBar(mode){
  const bar = $('bar');
  bar.classList.toggle('indet', mode === 'indet');
  if (mode === 'indet' || mode === 'error' || mode === 'done') {
    $('barFill').style.width = '0%';
  }
  if (mode === 'done') {
    $('barFill').style.width = '100%';
    $('barFill').style.background = 'linear-gradient(90deg,#3f7d55,#5fb87c)';
  }
  if (mode === 'error') {
    $('barFill').style.width = '100%';
    $('barFill').style.background = '#e06c6c';
  }
  if (mode === 'fill') {
    $('barFill').style.background = 'linear-gradient(90deg,#4f7cff,#6fa0ff)';
  }
}

// ═══ 渲染 ═══
function render(st){
  S = st;
  const mf = st.minecraft || {}, ml = st.modloader || {}, srv = st.server || {};

  $('fMc').textContent = mf.version || '—';
  $('fNf').textContent = ml.version || '—';
  if (srv.name) $('srvName').textContent = srv.name;
  if (srv.address) $('srvAddr').textContent = srv.address;

  const v = (st.variants || []).find(x => x.id === st.variant);
  $('fMods').textContent = v ? v.mods_count : '—';
  $('fRam').textContent = st.memory ? (st.memory.xmx_mb + ' MB') : '—';

  // 连接状态
  const chip = $('connChip'), ctext = $('connText');
  if (st.manifest_error) {
    chip.querySelector('.dot').className = 'dot warn';
    ctext.textContent = '离线';
  } else if (st.offline) {
    chip.querySelector('.dot').className = 'dot warn';
    ctext.textContent = '离线缓存';
  } else {
    chip.querySelector('.dot').className = 'dot ok';
    ctext.textContent = '已连接';
  }

  // 按钮状态
  const pending = st.pending || { files: 0, bytes: 0 };
  busy = false;
  if (pending.files > 0) {
    ready = false;
    $('btnMain').textContent = '开始准备 (' + pending.files + ' 个文件)';
    setBar('fill'); $('barFill').style.width = '0%';
    $('pText').textContent = '需要下载 ' + fmtBytes(pending.bytes);
    $('pPct').textContent = '';
    $('btnMain').disabled = false;
    $('pill').className = 'pill'; $('pill').textContent = '待准备';
    $('tbState').textContent = '就绪';
  } else {
    ready = true;
    $('btnMain').textContent = '进入游戏';
    $('btnMain').disabled = false;
    setBar('done');
    $('pText').textContent = '客户端已就绪';
    $('pPct').textContent = '100%';
    $('pill').className = 'pill ok'; $('pill').textContent = '● 已就绪';
    $('tbState').textContent = '就绪';
  }

  // 设置面板
  $('pHw').textContent = (st.hardware_text || '').replace(/\n/g, '  ·  ');
  const mem = st.memory || {};
  const ceiling = mem.ceiling_mb || 16384;
  const range = $('memRange');
  range.max = Math.max(2048, Math.ceil(ceiling / 512) * 512);
  range.value = mem.xmx_mb || 4096;
  $('memBig').textContent = mem.xmx_mb || '—';
  range.style.setProperty('--fill', ((range.value - range.min) / (range.max - range.min) * 100) + '%');
  $('tMin').textContent = '1024';
  $('tMax').textContent = '安全上限 ' + ceiling;

  let h = '本机物理内存 <b>' + Math.round((mem.total_ram_mb || 0) / 1024) + ' GB</b>，'
        + '游戏最多可用 <b>' + ceiling + ' MB</b>，其余留给系统和其它程序。';
  (mem.warnings || []).forEach(w => {
    h += '<br><span class="' + (w.level === 'danger' ? 'err' : 'warn') + '">⚠ ' + w.text + '</span>';
  });
  $('memHint').innerHTML = h;

  // 版本列表
  const rows = $('variantRows');
  rows.innerHTML = '';
  (st.variants || []).forEach(x => {
    const on = x.id === st.variant;
    const auto = x.id === st.variant_auto;
    const d = document.createElement('div');
    d.className = 'row';
    d.innerHTML = '<div><div class="nm">' + x.name +
      (auto ? ' <span style="font-size:10px;color:#5fb87c">· 推荐</span>' : '') +
      '</div><div class="ds">' + x.mods_count + ' 个模组 · 至少 ' + x.min_ram_mb + ' MB 内存</div></div>' +
      '<div class="right"><div class="seg"><button class="' + (on ? 'on' : '') + '">' +
      (on ? '使用中' : '切换') + '</button></div></div>';
    d.querySelector('button').onclick = async () => {
      const st2 = await api.set_variant(x.id);
      render(st2);
    };
    rows.appendChild(d);
  });

  $('playerName').value = (st.settings || {}).player_name || '';
  // 服务器地址：留空 = 自动（内网可达走内网，否则公网）
  // 注意变量名别用 srv —— render() 里后面已经有一个 const srv，重名会让整个脚本语法失败
  const srvInfo = st.server || {};
  const srvInput = $('srvAddr');
  srvInput.value = (st.settings || {}).server_address || '';
  srvInput.placeholder = srvInfo.address_public || '自动';
  const srcMap = { manual: '手动指定', lan: '内网直连', 'public': '公网' };
  const srcTxt = srcMap[srvInfo.source] || '';
  $('srvHint').textContent = (st.settings || {}).server_address
    ? '手动：' + (srvInfo.address || '—')
    : ((srvInfo.source === 'lan')
        ? '自动 · 内网 ' + srvInfo.address + '（公网域名在内网连不上）'
        : '留空 = 自动 · 当前 ' + (srvInfo.address || '—') + (srcTxt ? '（' + srcTxt + '）' : ''));
  srvInput.onchange = async () => {
    const st2 = await api.set_server_address(srvInput.value.trim());
    render(st2);
  };

  const aj = (st.settings || {}).auto_join !== false;
  [].forEach.call($('autoJoinSeg').children, b => {
    b.classList.toggle('on', (b.dataset.v === '1') === aj);
    b.onclick = async () => {
      await api.set_auto_join(b.dataset.v === '1');
      const st2 = await api.state();
      render(st2);
    };
  });

  const j = st.java || {};
  $('javaHint').innerHTML = j.path
    ? (j.bundled ? '✓ 使用启动器内置 64 位 Java' : '使用系统 Java：<span class="mono">' + j.path + '</span>')
    : '<span class="err">未找到 Java，无法启动</span>';

  $('jvmArgs').textContent = (mem.jvm_args || []).join(' ') || '—';
}

function fmtBytes(n){
  if (!n) return '0 MB';
  if (n > 1073741824) return (n / 1073741824).toFixed(1) + ' GB';
  return Math.round(n / 1048576) + ' MB';
}

// ═══ 交互 ═══
$('btnMain').onclick = async () => {
  if (busy) return;
  if (!ready) { startInstall(); return; }
  const r = await api.launch();
  if (r && r.ok === false) { toast(r.error); } else { startPolling(); }
};

$('btnSettings').onclick = () => $('panel').classList.add('on');
$('btnOnboard').onclick = () => { $('panel').classList.remove('on'); openWizard(); };
$('btnClosePanel').onclick = () => $('panel').classList.remove('on');
$('btnReset').onclick = async () => {
  const st = await api.reset_settings();
  render(st);
};

let memTimer = null;
$('memRange').oninput = (e) => {
  const val = parseInt(e.target.value, 10);
  $('memBig').textContent = val;

// ══════════ 下载详情：步骤清单 ══════════
const STEP_DEF = [
  ['disk',      '检查磁盘空间'],
  ['loader',    '安装模组加载器'],
  ['libraries', '补齐运行库'],
  ['assets',    '下载游戏资源'],
  ['files',     '同步模组与配置'],
];

function resetSteps(){
  $('steps').innerHTML = STEP_DEF.map(([k, n]) =>
    '<div class="stp" data-k="' + k + '"><i class="ic"></i>' +
    '<span class="nm">' + n + '</span><span class="ms"></span></div>').join('');
}

function updateSteps(step, pct, msg){
  const idx = STEP_DEF.findIndex(d => d[0] === step);
  if (idx < 0) return;
  document.getElementById('app').classList.add('busy');
  const kids = $('steps').children;
  for (let i = 0; i < kids.length; i++){
    const el = kids[i];
    el.classList.remove('doing', 'fail');
    if (i < idx){ el.classList.add('done'); el.querySelector('.ms').textContent = ''; }
    if (i === idx){
      el.classList.add(pct >= 1 ? 'done' : 'doing');
      el.querySelector('.ms').textContent = msg || '';
    }
  }
}

function failSteps(){
  const kids = $('steps').children;
  for (let i = 0; i < kids.length; i++){
    if (kids[i].classList.contains('doing')){
      kids[i].classList.remove('doing');
      kids[i].classList.add('fail');
      return;
    }
  }
}

           '<div class="bm"><span>约 3 秒，用游戏同款 Java 实测</span></div></div>';

  const r = b.ratios || {}, raw = b.raw || {};

    '<div class="bsc"><b>' + (b.score || 0).toFixed(2) + '</b><i>× 综合性能</i></div>' +
    '<div class="bm">' +

// ══════════ 引导新增两步的交互（昵称 / 加群）══════════
function esc(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function bindNameStep(){
  const inp = $('wNameInput'), cnt = $('wNameCnt'), err = $('wNameErr'), next = $('wNext');
  if (!inp) return;
  const check = function(){
    const v = (inp.value || '').trim();
    cnt.textContent = (inp.value || '').length + '/16';
    const ok = NAME_RE.test(v);
    err.textContent = (v && !ok) ? '只能用中文、字母、数字、下划线，长度 2~16' : '';
    err.className = 'wname-err' + ((v && !ok) ? ' on' : '');
    next.disabled = !ok;                     // 不合格就不让往下走
    return ok;
  };
  inp.oninput = check;
  inp.onkeydown = function(e){ if (e.key === 'Enter' && check()) next.click(); };
  check();
  setTimeout(function(){ try { inp.focus(); inp.select(); } catch (e) {} }, 80);
}

function bindQQStep(){
  const hint = $('qqHint');
  const say = function(t){
    hint.textContent = t; hint.className = 'qqhint on';
    clearTimeout(hint._t);
    hint._t = setTimeout(function(){ hint.className = 'qqhint'; }, 2800);
  };
  $('qqCopy').onclick = async function(){
    // 冻结包里是 file:// 环境，navigator.clipboard 常被判为非安全上下文，所以留一条退路
    let ok = false;
    try { await navigator.clipboard.writeText(QQ_GROUP); ok = true; } catch (e) {}
    if (!ok){
      try {
        const ta = document.createElement('textarea');
        ta.value = QQ_GROUP;
        ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        ok = document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (e) {}
    }
    say(ok ? '群号已复制，去 QQ 里粘贴搜索' : '复制没成功，手动记一下：' + QQ_GROUP);
  };
  $('qqOpen').onclick = async function(){
    try { await api.open_url(QQ_URL); say('已在浏览器打开加群页'); }
    catch (e) { say('打不开就手动搜群号：' + QQ_GROUP); }
  };
}

$('wBack').onclick = () => { if (wStep > 0){ wStep--; renderWizard(); } };

async function runBench(){

    const b = await api.benchmark();

  } catch (e) {}

async function applyBench(b){
  if (!b || !b.ok) return;
  if (S) S.bench = b;
  if ($('wizard').classList.contains('on')) renderWizard();
  try { render(await api.state()); } catch (e) {}

// ══════════ 安装入口（主按钮与引导共用）══════════
async function startInstall(){
  if (busy) return;
  resetSteps();
  const r = await api.start();
  if (r && r.ok === false){ toast(r.error); return; }
  busy = true;
  $('btnMain').disabled = true;
  $('btnMain').textContent = '准备中';
  setBar('indet');
  startPolling();
}

// ═══ 启动 ═══
(async function init(){
  try {
    // 先等后端桥接把方法挂上（macOS 上桥分两步注入，只等对象存在不够）
    const bridged = await waitMethod('bootstrap', 20000);
    if (!bridged && !MOCK_API) {
      $('pText').textContent = '启动器后端没有响应（桥接未就绪），请重启应用';
      setBar('error');
      $('btnMain').textContent = '重试';
      $('btnMain').disabled = false;
      $('btnMain').onclick = () => location.reload();
      return;
    }
    const st = await api.bootstrap();
    render(st);
    resetSteps();
    // 开发/截图用：index.html?panel=1 直接展开设置面板
    if (location.search.indexOf('panel=1') >= 0) $('panel').classList.add('on');
    // 首次使用（或 ?onboard=1）走引导
    const done = ((st.settings || {}).onboarded) === true;
    if (!done || location.search.indexOf('onboard=1') >= 0) openWizard();
    // 后台跑性能实测：用户看第 1 页的时间就够它跑完，体感零等待
    if (!(st.bench && st.bench.ok)) runBench();
    // 每次启动都查一遍启动器更新（用户明确要求；查不到就当没事）
    checkUpdatesOnBoot();
  } catch (e) {
    const emsg = (e && (e.message || e.name)) ? (e.message || e.name) : String(e);
    $('pText').textContent = '启动器初始化失败：' + emsg;
    $('btnMain').textContent = '重试';
    $('btnMain').disabled = false;
    // 错误落盘到后端 launcher.log —— 用户机器上没有控制台，日志是唯一排障入口
    try { api.client_error('bootstrap 失败: ' + emsg + '\n' + ((e && e.stack) || '')); } catch (_) {}
  }
})();

// ═══ 开发/截图用的假桥（浏览器直接打开时生效）═══
// 截图/调试：如果外部注入了真实 state（ui/dev-state.json），就用真实数据
function realApi(HWD){
  const clone = (o) => JSON.parse(JSON.stringify(o));
  return {
    bootstrap: async () => clone(HWD),
    state: async () => clone(HWD),
    start: async () => ({ok:true}),
    launch: async () => ({ok:true}),
    set_variant: async (v) => { HWD.variant = v; return clone(HWD); },
    set_memory: async (m) => { if (HWD.memory) HWD.memory.xmx_mb = m; return clone(HWD); },
    set_player: async () => clone(HWD),
    set_auto_join: async () => clone(HWD),
    set_server_address: async () => clone(HWD),
    client_error: async () => ({ok:true}),
    reset_settings: async () => clone(HWD),
    finish_onboard: async () => { (HWD.settings = HWD.settings || {}).onboarded = true;
                                  return clone(HWD); },
    benchmark: async () => clone(HWD.bench || {ok:false}),
    poll: async () => ({seq:0, kind:null, data:{}}),
    check_updates_async: async () => ({ok:true}),
    get_update: async () => ({checking:false, update:null}),
    open_download_page: async () => ({ok:true, url:'https://www.cogcraft.top/#download'}),
    // 自更新：浏览器里没法替换自己，默认回「环境不支持」走手动下载；
    // 具体状态由 window.__SU 驱动，好让界面这些分支能被自动测试覆盖
    update_capability: async () => clone((window.__SU || {}).capability
      || {ok:false, reason:'浏览器预览模式不支持自动更新',
          fallback_url:'https://www.cogcraft.top/#download'}),
    prepare_update: async () => {
      const su = (window.__SU = window.__SU || {});
      su.prepareCalls = (su.prepareCalls || 0) + 1;
      return clone(su.prepareResult || {ok:false, fallback:true,
        reason:'浏览器预览模式不支持自动更新',
        fallback_url:'https://www.cogcraft.top/#download'});
    },
    get_update_progress: async () => clone((window.__SU || {}).progress
      || {phase:'idle', pct:0, ready:false, version:'', error:null}),
    apply_update: async () => {
      const su = (window.__SU = window.__SU || {});
      su.applyCalls = (su.applyCalls || 0) + 1;
      return clone(su.applyResult || {ok:false, error:'浏览器预览模式不支持自动更新'});
    }
  };
}
