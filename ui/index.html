<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cogcraft</title>
<!-- 样式与脚本已拆分，见 ui/style.css 与 ui/js/*.js -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div class="topbar">
    <span class="brand">cogcraft</span>
    <span class="sep">/</span>
    <span id="tbState">正在连接服务器</span>
    <div class="spacer"></div>
    <div class="chip" id="connChip"><span class="dot"></span><span id="connText">检查中</span></div>
    <button class="chip up" id="upChip" hidden></button>
    <button class="iconbtn" id="btnSettings" title="设置" aria-label="打开设置">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>

  <div class="main">
    <div class="grid"></div>
    <div class="hero">
      <div class="mark"><span>cc</span></div>
      <h1>cogcraft <em>客户端</em></h1>
      <div class="srv"><span id="srvName">像素工坊</span><span class="sep">·</span>
        <span id="srvAddr">cogcraft.top:25565</span></div>
    </div>

    <div class="steps" id="steps"></div>

    <div class="prog">
      <div class="bar" id="bar"><i id="barFill"></i></div>
      <div class="ptxt"><span id="pText">正在检查客户端文件</span><span id="pPct"></span></div>
    </div>

    <button class="btn" id="btnMain" disabled>请稍候</button>

    <div class="foot">
      <span>Minecraft <b id="fMc">1.21.1</b></span>
      <span>NeoForge <b id="fNf">21.1.264</b></span>
      <span>模组 <b id="fMods">—</b></span>
      <span>内存 <b id="fRam">—</b></span>
    </div>
    <div class="pill" id="pill">正在初始化</div>
  </div>

  <!-- 首次引导 -->
  <div class="wizard" id="wizard">
    <div class="wtop">
      <span class="brand">cogcraft</span>
      <span class="sep">/</span>
      <span class="cur" id="wStepName">欢迎</span>
      <div class="wdots" id="wDots"><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="wbody" id="wBody"></div>
    <div class="wfoot">
      <button class="btn sub" id="wBack">上一步</button>
      <div class="spacer"></div>
      <button class="btn" id="wNext">开始配置</button>
    </div>
  </div>

  <!-- 设置面板 -->
  <div class="panel" id="panel">
    <div class="phead"><h2>设置</h2><p id="pHw"></p></div>
    <div class="pbody">
      <div class="col">
        <div class="card">
          <div class="lab">分配给游戏的内存</div>
          <div class="big"><span id="memBig">—</span><span>MB</span></div>
          <input type="range" id="memRange" min="1024" max="16384" step="512">
          <div class="ticks"><span id="tMin">1024</span><span id="tMax">16384</span></div>
          <div class="hint" id="memHint"></div>
        </div>
        <div class="card">
          <div class="lab" style="margin-bottom:10px">客户端版本</div>
          <div id="variantRows"></div>
        </div>
      </div>
      <div class="col">
        <div class="card">
          <div class="lab">玩家</div>
          <input type="text" id="playerName" maxlength="16" placeholder="游戏内名字">
          <div class="row" style="padding-top:12px">
            <div><div class="nm">自动进入服务器</div>
              <div class="ds">跳过主菜单直接连服</div></div>
            <div class="right"><div class="seg" id="autoJoinSeg">
              <button data-v="1">开启</button><button data-v="0">关闭</button></div></div>
          </div>
          <div class="row" style="padding-top:12px">
            <div><div class="nm">服务器地址</div>
              <div class="ds" id="srvHint">留空 = 自动</div></div>
            <div class="right"><input type="text" id="srvAddr" placeholder="自动"
              style="width:158px;text-align:right;font-size:12px"></div>
          </div>
        </div>
        <div class="card">
          <div class="lab" style="margin-bottom:8px">Java 运行时</div>
          <div class="hint" id="javaHint" style="margin-top:0">—</div>
        </div>
        <div class="card">
          <div class="lab">JVM 参数<span style="margin-left:auto;font-size:10.5px;color:#3f4855">自动生成</span></div>
          <div class="args mono" id="jvmArgs" style="margin-top:8px">—</div>
        </div>
      </div>
    </div>
    <div class="pfoot">
      <button class="btn sub" id="btnReset">恢复推荐</button>
      <button class="btn sub" id="btnOnboard" style="width:96px">重新引导</button>
      <div class="spacer"></div>
      <button class="btn sub" id="btnClosePanel" style="width:110px">关闭</button>
    </div>
  </div>
</div>
<script src="js/00-bridge-api.js"></script>
<script src="js/01-core.js"></script>
<script src="js/02-events.js"></script>
<script src="js/03-selfupdate.js"></script>
<script src="js/04-render.js"></script>
<script src="js/05-ui-bind.js"></script>
<script src="js/06-steps.js"></script>
<script src="js/07-bench.js"></script>
<script src="js/08-wizard.js"></script>
<script src="js/09-bench-install.js"></script>
</body>
</html>
